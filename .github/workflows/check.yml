name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Debian trixie ships the Qt 6.8 / Plasma 6.3 the plugin targets.
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git shellcheck \
            qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts qml6-module-qtcore qml6-module-qttest \
            qml6-module-org-kde-kirigami qml6-module-org-kde-kquickcontrols

      # org.kde.taskmanager only ships in plasma-workspace, whose dependencies are most
      # of a desktop. qmllint only reads the module's qmltypes, so unpack just that.
      - name: Extract org.kde.taskmanager QML module
        run: |
          cd "$(mktemp -d)"
          apt-get download plasma-workspace
          dpkg-deb --fsys-tarfile plasma-workspace_*.deb \
            | tar -x -C / ./usr/lib/x86_64-linux-gnu/qt6/qml/org/kde/taskmanager

      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck check.sh install.sh

      - name: Lint and test
        run: ./check.sh
